<td class="employee-name">{{ employee().name }} {{ employee().surname }}</td>
<td>{{ employee().jobRole }}</td>
<td>{{ employee().jobRoleLevel }}</td>
<td>{{ employee().company }}</td>
<td class="actions-cell">
  <button class="btn-action-icon btn-details" type="button" 
          (click)="viewEmployee.emit(employee())" 
          matTooltip="Dettagli" 
          matTooltipPosition="above"
          aria-label="Dettagli">
    <mat-icon class="action-icon">visibility</mat-icon>
  </button>

  @if(canEditGlobal()) {
    <button class="btn-action-icon btn-edit" type="button" 
            (click)="editEmployee.emit(employee())" 
            matTooltip="Modifica" 
            matTooltipPosition="above"
            aria-label="Modifica">
      <mat-icon class="action-icon">edit</mat-icon>
    </button>
  }

  @if(canEditGlobal()) {
    <button class="btn-action-icon btn-remove-single" type="button" 
      (click)="deleteEmployee.emit(employee())"
      matTooltip="Elimina" 
      matTooltipPosition="above">
      <mat-icon class="action-icon">delete</mat-icon>
    </button>
  }
</td>
