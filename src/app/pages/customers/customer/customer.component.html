<!-- elemento Cliente, equivalente ad una riga -->
<app-table-row [cols]="colsCount">
  @for (c of columns; track c.header) {
    <div
      class="tbl-cell"
      [class.tbl-cell--right]="c.align === 'right'"
      [class.tbl-cell--center]="c.align === 'center'"
    >
      {{ c.value(customer()) }}
    </div>
  }
  <div class="tbl-cell tbl-cell--actions">
    <button appButton [routerLink]="['/clienti', customer().id]" class="btn btn-primary">Visualizza</button>
    <button appButton class="btn btn-secondary" (click)="openEdit(customer())">Modifica</button>
  </div>
</app-table-row>
