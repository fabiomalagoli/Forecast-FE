<div class="card">
  <div class="card-header">
    <h2 class="customer-name">{{ cards().customer }}</h2>
    <div class="header-meta">
      <div class="activity">{{ cards().activity }}</div>
      <div class="status">{{ cards().projectStatus }}</div>
    </div>
  </div>

  <div class="project-name">{{ cards().projectName }}</div>

  <div class="card-body">
    <div class="meta-line">Persone allocate: <span class="meta-value">{{ cards().employeeCount }}</span></div>
    <div class="meta-line">Totale (€): <span class="meta-value">{{ cards().totalBudget }}</span></div>
  </div>
</div>
