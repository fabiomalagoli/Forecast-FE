<td>{{ role().name }}</td>
<td class="actions-cell">
  <button appButton class="btn-small" type="button" (click)="showResources.emit(role())">
    Risorse Associate
  </button>
  <button appButton class="btn-small btn-outline" type="button" (click)="editRole.emit(role())">
    Modifica
  </button>
  <button
    class="icon-btn tooltip-container"
    type="button"
    data-tooltip="Assegna Risorse al Ruolo"
    (click)="assignResourcesToRoles.emit(role())">
    <span class="material-symbols-outlined bold-icon">add</span>
  </button>
</td>
