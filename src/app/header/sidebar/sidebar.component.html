<div class="d-flex flex-column flex-shrink-0 p-3 bg-white border-end sidebar-container">
  
  <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
    <span class="fs-4">ForecastWeb</span>
  </a>
  
  <hr>
  
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
        <a class="nav-link text-dark" 
          [class.active]="activeMenu() === 'Home'" 
          style="cursor: pointer;" 
          (click)="onBtnClick('Home')">
          <img src="home-icon.svg" alt="Home" class="sidebar-icon me-2" />
          Home
        </a>
    </li>
      
      <li class="nav-item">
        <a class="nav-link text-dark" 
          [class.active]="activeMenu() === 'Clienti'" 
          style="cursor: pointer;" 
          (click)="onBtnClick('Clienti')">
          <img src="customer-icon.svg" alt="Clienti" class="sidebar-icon me-2" />
          Clienti
        </a>
      </li>
      
      <li class="nav-item">
        <a class="nav-link text-dark" 
          [class.active]="activeMenu() === 'Progetti'" 
          style="cursor: pointer;" 
          (click)="onBtnClick('Progetti')">
          <img src="project-icon.svg" alt="Progetti" class="sidebar-icon me-2" />
          Progetti
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link text-dark" 
          [class.active]="activeMenu() === 'Risorse'" 
          style="cursor: pointer;" 
          (click)="onBtnClick('Risorse')">
          <img src="resource-icon.svg" alt="Risorse" class="sidebar-icon me-2" />
          Risorse
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link text-dark" 
          [class.active]="activeMenu() === 'Ruoli'" 
          style="cursor: pointer;" 
          (click)="onBtnClick('Ruoli')">
          <img src="role-icon.svg" alt="Ruoli" class="sidebar-icon me-2" />
          Ruoli
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link text-dark" 
          [class.active]="activeMenu() === 'Workgroups'" 
          style="cursor: pointer;" 
          (click)="onBtnClick('Workgroups')">
          <img src="workgroup-icon.svg" alt="Workgroups" class="sidebar-icon me-2" />
          Gruppi di Lavoro
        </a>
      </li>

  </ul>

  <hr>

  <div class="user-info">
    <button 
      [matMenuTriggerFor]="userMenu" 
      class="user-menu-btn"
      type="button">
      
      <span class="user-full-name">{{ firstName() }} {{ lastName() }}</span>
      
      <mat-icon class="dropdown-icon">expand_more</mat-icon>

      <div class="account-picture-container">
        @if (currentUser()) {
          @if (profilePictureUrl()) {
            <img 
              [src]="profilePictureUrl()" 
              alt="Foto profilo" 
              class="account-picture" />
          } @else {
            <div class="account-initials">
              {{ firstName()[0] || '' }}
            </div>
          }
        }
      </div>
    </button>

    <mat-menu #userMenu="matMenu" panelClass="custom-user-menu" xPosition="before">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>
</div>
