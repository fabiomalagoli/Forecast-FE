@if (authService.isAuthenticated()) {
  <!-- Shell principale dell'app  -->
  <main class="app-shell"> 
    <app-sidebar (selected)="OnSidebarIdSelected($event)"></app-sidebar>
    
    <div class="content-container flex-grow-1 bg-light p-4">
      <router-outlet />
    </div>
  </main>
} @else {
  <!-- Schermata intera per il Login -->
  <router-outlet />
}
