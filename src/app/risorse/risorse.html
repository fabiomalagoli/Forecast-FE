<div class="page-header">
  <h2>Risorse</h2>
</div>

@if(isFetching()) {
  <div class="loading-state">
    <p>Caricamento risorse in corso...</p>
  </div>
} @else if (error()) {
  <div class="error-state">
    <p>{{ error() }}</p>
    <button appButton (click)="aggiornaRisorse()">Riprova</button>
  </div>
} @else {
    <div class="resources-layout" [class.panel-open]="isRisorsaInAggiunta() || risorsaInModifica() !== null">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Risorsa</th>
                        <th>Ruolo</th>
                        <th>Livello</th>
                        <th>Azienda</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody>
                @for (r of risorse(); track r.id) {
                    <tr
                      app-risorsa-row
                      [risorsa]="r"
                      (editRisorsa)="apriModifica($event)">
                    </tr>
                }
                </tbody>
            </table>
        </div>
    </div>
}

<mat-paginator
    [length]="pagination()?.totalCount || 0"
    [pageSize]="pageSize"
    [pageIndex]="currentPage() - 1"
    [pageSizeOptions]="[5, 10, 20, 50]"
    [showFirstLastButtons]="true"
    (page) = "onPageChange($event)">
</mat-paginator>

@if(risorsaInModifica()) {
    <app-modifica-risorsa
        [risorsaDaModificare]="risorsaInModifica()"
        (cancel)="chiudiModifica()"
        (modified)="salvaModifica()"
    ></app-modifica-risorsa>
}

@if(isRisorsaInAggiunta()) {
    <app-new-risorsa
        [risorsaDaAggiungere]="risorsaInAggiunta()"
        (cancel)="isRisorsaInAggiunta.set(false)"
        (added)="aggiungiRisorsa($event)"
    ></app-new-risorsa>
}

<div class="bottom-actions">
    <button appButton class="btn-add" (click)="onAggiuntaRisorsa()">+ Aggiungi Risorsa</button>
</div>
