@if (isClienteInAggiunta) {
  <app-new-cliente (cancel)="annullaAggiuntaCliente()" (created)="aggiungiCliente($event)" />
}
<header>
  <button appButton (click)="onAggiuntaCliente()">
    Aggiungi Cliente
    <span class="icon">+</span>
  </button>
</header>

<!-- Header -->
<app-table-row [cols]="clientiColsCount">
  @for (c of columns; track c.header) {
    <div class="tbl-header">
      <!-- inserimento dei titoli dei valori per numero di tipo di valori -->
      <strong>{{ c.header }}</strong>
    </div>
  }
  <!-- <div class="tbl-header tbl-header--actions">
    <strong>Azioni</strong>
  </div> -->
</app-table-row>

<!-- Righe -->
@for (cliente of dummyClienti; track $index) {
  <!-- inserimento dei dati per n. clienti presenti distribuiti sulle colonne -->
  <app-cliente [cliente]="cliente" [columns]="columns"></app-cliente>
}
