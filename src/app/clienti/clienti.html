<!-- Header -->
<app-table-row [cols]="clientiColsCount">
  @for (c of columns; track c.header) {
    <div class="tbl-header">
      <strong>{{ c.header }}</strong> <!-- inserimento dei titoli dei valori per numero di tipo di valori -->
    </div>
  }
</app-table-row>

<!-- Righe -->
@for (cliente of dummyClienti; track $index) {
  <app-cliente [cliente]="cliente" [columns]="columns"></app-cliente> <!-- inserimento dei dati per n. clienti presenti distribuiti sulle colonne -->
}
