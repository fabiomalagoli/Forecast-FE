<div class="card">
  <div class="col-sx">
    <h2>{{ card().customer }}</h2>
    <h3>{{ card().activity }}</h3>
  </div>
  <div class="col-dx">
    <div class="info-g">
      <h4>Stato</h4>
      <p>{{ card().projectStatus }}</p>
    </div>
    <div class="info-g">
      <h4>Persone</h4>
      <p>{{ card().employeeCount }}</p>
    </div>
    <div class="info-g">
      <h4>Totale (€)</h4>
      <p>{{ card().totalBudget }}</p>
    </div>
  </div>
</div>
