<div class="card">
  <div class="col-sx">
    <h2>{{ card().cliente }}</h2>
    <h3>{{ card().progetto }}</h3>
  </div>
  <div class="col-dx">
    <div class="info-g">
      <h4>Stato</h4>
      <p>{{ card().stato }}</p>
    </div>
    <div class="info-g">
      <h4>Persone</h4>
      <p>{{ card().persone }}</p>
    </div>
    <div class="info-g">
      <h4>Totale (€)</h4>
      <p>{{ card().totale }}</p>
    </div>
  </div>
</div>
